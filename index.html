<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Pelaporan - Badan Kesbangpol</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #004085;
            --accent-color: #ffc107;
            --bg-light: #f4f7f9;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            background-attachment: fixed;
            min-height: 100vh;
            margin: 0;
        }

        /* --- Header Modern --- */
        .header-section {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            padding: 15px 0;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .logo-side {
            width: 60px;
            height: auto;
            object-fit: contain;
        }

        .header-content {
            text-align: center;
            flex: 1;
        }

        .header-content h1 {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary-color);
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .header-content p {
            font-size: 0.75rem;
            color: #444;
            margin: 4px 0 0 0;
            font-weight: 500;
        }

        .logo-tengah {
            height: 35px;
            margin-bottom: 8px;
        }

        /* --- Formulir --- */
        .main-container {
            padding: 40px 20px;
        }

        .card-upload {
            max-width: 550px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.8);
        }

        .form-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }

        .form-control, .form-select {
            border-radius: 10px;
            padding: 12px 15px;
            border: 2px solid #eee;
            transition: 0.3s;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: none;
        }

        .btn-submit {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            width: 100%;
            font-weight: 700;
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn-submit:hover {
            background: #002d5e;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,64,133,0.3);
        }

        .btn-submit:disabled {
            background: #ccc;
            transform: none;
        }

        /* --- Status Pesan --- */
        #statusMessage {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-size: 0.9rem;
        }

        /* Responsive Mobile */
        @media (max-width: 768px) {
            .header-container { flex-direction: row; }
            .logo-side { width: 45px; }
            .header-content h1 { font-size: 0.9rem; }
            .header-content p { font-size: 0.65rem; }
        }
    </style>
</head>
<body>

    <header class="header-section">
        <div class="header-container">
            <img src="logo-kiri.png" class="logo-side" alt="Logo Kiri">
            
            <div class="header-content">
                <img src="logo-tengah.png" class="logo-tengah" alt="Logo Tengah">
                <h1>Klinik Demokrasi & Tata Kelola Parpol</h1>
                <p>BADAN KESATUAN BANGSA DAN POLITIK PROVINSI KEPULAUAN RIAU</p>
            </div>

            <img src="logo-kanan.png" class="logo-side" alt="Logo Kanan">
        </div>
    </header>

    <div class="main-container">
        <div class="card-upload">
            <h3 class="text-center mb-4" style="font-weight: 700;">Kirim Laporan PDF</h3>
            
            <form id="uploadForm">
                <div class="mb-4">
                    <label class="form-label">Nama Partai Politik</label>
                    <input type="text" id="namaPartai" class="form-control" placeholder="Contoh: Partai ABC" required>
                </div>

                <div class="mb-4">
                    <label class="form-label">Tahun Anggaran</label>
                    <select id="tahunAnggaran" class="form-select" required>
                        <option value="2024">2024</option>
                        <option value="2025">2025</option>
                        <option value="2026">2026</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label">Dokumen Laporan (PDF)</label>
                    <input type="file" id="fileInput" class="form-control" accept="application/pdf" required>
                    <div class="form-text mt-2">Pastikan file dalam format .pdf (Maks. 10MB)</div>
                </div>

                <button type="submit" id="btnSubmit" class="btn-submit">
                    UNGGAH LAPORAN SEKARANG
                </button>
            </form>

            <div id="statusMessage"></div>
        </div>
    </div>

    <script>
        // GANTI URL DI BAWAH INI DENGAN URL WEB APP ANDA (YANG BERAKHIRAN /exec)
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxbnR4BmMOTEZkQLvAtT_QPQuQ2Cm07Ap3xKk5ySb_45getOy6--yuNurPEIlOIY2dx/exec';

        const form = document.getElementById('uploadForm');
        const status = document.getElementById('statusMessage');
        const btn = document.getElementById('btnSubmit');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const file = document.getElementById('fileInput').files[0];
            if (!file) return;

            // Efek Loading
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Mengirim data...';
            status.style.display = 'block';
            status.className = 'alert alert-info';
            status.innerHTML = '⏳ <b>Sedang mengunggah...</b> Mohon tunggu sampai selesai.';

            const reader = new FileReader();
            reader.onload = function(e) {
                const bytes = Array.from(new Uint8Array(e.target.result));
                
                const data = {
                    nama: document.getElementById('namaPartai').value,
                    tahun: document.getElementById('tahunAnggaran').value,
                    fileName: file.name,
                    mimeType: file.type,
                    data: bytes
                };

                fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(data),
                    mode: 'no-cors'
                })
                .then(() => {
                    status.className = 'alert alert-success';
                    status.innerHTML = '✅ <b>Berhasil!</b> Laporan Anda telah kami terima.';
                    form.reset();
                })
                .catch(err => {
                    status.className = 'alert alert-danger';
                    status.innerHTML = '❌ <b>Gagal!</b> Terjadi kesalahan koneksi.';
                    console.error(err);
                })
                .finally(() => {
                    btn.disabled = false;
                    btn.innerHTML = 'UNGGAH LAPORAN SEKARANG';
                });
            };
            reader.readAsArrayBuffer(file);
        });
    </script>

</body>
</html>
